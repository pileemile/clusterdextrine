engines:
  format: false
  lint: false
  code-quality: true
  ai-slop: true
  architecture: false
  security: true

ci:
  failBelow: 85
  failOnMissingTools: false

telemetry:
  enabled: false

exclude:
  - "**/migrations/**"
  - "**/www/**"
  - "**/android/**"
  - "**/ios/**"
  - "**/.angular/**"
  - "**/venv/**"
  - "**/.venv/**"
  - "**/*.min.js"
  - "node_modules/**"
  - "public/tracing.js"
  - "public/agenda.min.js"
  - "k6-report.*"
  - "rapport.html"
