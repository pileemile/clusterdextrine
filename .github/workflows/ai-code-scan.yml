name: AI code scan

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-code-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AISLOP_VERSION: "0.22.1"

jobs:
  aislop:
    # Ce nom est le status check exigé par le ruleset (scripts/setup-branch-protection.sh).
    name: aislop
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run AISlop quality gate
        env:
          AISLOP_NO_HISTORY: "1"
        run: |
          npx --yes "aislop@${AISLOP_VERSION}" ci . > aislop-report.json

      - name: Résumé dans la PR
        if: always()
        run: |
          if [ -s aislop-report.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("aislop-report.json"))
          print("## AISlop")
          print(f"**Score : {d.get('score')} / 100** ({d.get('label')})")
          print()
          print("| Moteur | Problèmes |")
          print("|---|---|")
          for name, e in (d.get("engines") or {}).items():
              print(f"| {name} | {e.get('issues')} |")
          PY
          else
            echo "::error::aislop-report.json est absent ou vide : le scan n'a pas tourné correctement."
            exit 1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aislop-report
          path: aislop-report.json
          if-no-files-found: warn
          retention-days: 30
