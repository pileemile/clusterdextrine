name: Load test (k6)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/sample_weatherdata
      PORT: 3000
      BASE_URL: http://127.0.0.1:3000
      DURATION: "20s"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start API
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -sf "$BASE_URL/api" >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          exit 1

      - name: Install k6
        run: |
          curl --fail --silent --show-error https://dl.k6.io/key.gpg \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/k6-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run load test
        run: k6 run --summary-export=summary.json loadtest.js

      - name: Publish summary
        if: always()
        run: node scripts/k6-summary.js summary.json

      - name: Open GitHub issue
        if: failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "k6" --color B60205 --description "Échec du test de charge" || true
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f k6-failure.md ]; then
            title=$(head -n 1 k6-failure-title.txt)
            {
              echo "Run : $run_url"
              echo
              echo "Commit : \`${{ github.sha }}\`"
              echo
              cat k6-failure.md
            } > /tmp/k6-issue.md
          else
            title="Test de charge en échec avant le résumé k6"
            {
              echo "Le job a échoué avant d'avoir un résumé de seuils."
              echo
              echo "Run : $run_url"
              echo
              echo "Commit : \`${{ github.sha }}\`"
            } > /tmp/k6-issue.md
          fi
          gh issue create --title "$title" --body-file /tmp/k6-issue.md --label k6

      - name: Upload k6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-rapport
          path: |
            summary.json
            rapport.html
          if-no-files-found: warn
