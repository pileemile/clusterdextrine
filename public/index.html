<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ciel</title>
    <meta name="description" content="Consultez, créez et modifiez les relevés météo." />
    <meta name="theme-color" content="#ffffff" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230c74a8' stroke-width='1.75' stroke-linecap='round'><circle cx='12' cy='12' r='4'/><path d='M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <a class="skip" href="#une">Aller au contenu</a>

    <header class="header">
      <div class="wrap header__inner">
        <a class="logo" href="#une">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v2" />
            <path d="m4.93 4.93 1.41 1.41" />
            <path d="M20 12h2" />
            <path d="m19.07 4.93-1.41 1.41" />
            <path d="M15.947 12.65a4 4 0 0 0-5.925-4.128" />
            <path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z" />
          </svg>
          <span>ClusterDextrine</span>
        </a>

        <nav class="nav" aria-label="Sections">
          <a href="#une" aria-current="page">À la une</a>
          <a href="#releves">Relevés</a>
          <a href="/lieux.html">Mes lieux</a>
          <a href="/agenda.html">Agenda</a>
        </nav>

        <div class="header__actions">
          <label class="tenant-picker" for="tenantSelect" hidden>
            <span>Tenant</span>
            <select id="tenantSelect" aria-label="Choisir un tenant"></select>
          </label>
          <label class="search" for="searchInput">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input id="searchInput" type="search" placeholder="Station ou indicatif" autocomplete="off" spellcheck="false" maxlength="60" aria-label="Rechercher une station ou un indicatif" aria-describedby="browseSub" />
          </label>
          <button class="btn" type="button" id="searchBtn">Rechercher</button>
          <button class="btn" type="button" id="loginBtn" aria-haspopup="dialog">Connexion</button>
          <button class="btn btn--primary" type="button" data-new data-ab data-ready="false" aria-busy="true" aria-label="Chargement de l'action" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>
            <span class="btn__label" id="abLabel" data-ab-label></span>
          </button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="une" id="une" aria-busy="true" aria-live="polite">
        <div class="une__top">
          <div class="une__copy">
            <p class="kicker">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v2" />
                <path d="m4.93 4.93 1.41 1.41" />
                <path d="M20 12h2" />
                <path d="m19.07 4.93-1.41 1.41" />
                <path d="M15.947 12.65a4 4 0 0 0-5.925-4.128" />
                <path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z" />
              </svg>
              Relevé à la une
            </p>
            <div class="ph ph--title"></div>
            <div class="ph ph--line"></div>
          </div>
        </div>
      </section>

      <section class="section" id="releves" aria-labelledby="relevesTitle">
        <div class="section__head">
          <div>
            <h2 class="section__title" id="relevesTitle">Relevés <span class="section__count" id="browseCount"></span></h2>
            <p class="section__sub" id="browseSub">Chargement des relevés.</p>
          </div>
          <button class="btn" type="button" id="clearSearch" hidden>Effacer</button>
        </div>

        <div class="nearby" id="nearby">
          <button class="btn" type="button" id="nearbyBtn">Autour de moi (5 km)</button>
          <form class="nearby__form" id="nearbyForm">
            <div class="field">
              <label for="nearbyAddress">ou une adresse, un code postal</label>
              <input id="nearbyAddress" name="address" type="text" maxlength="120" autocomplete="off" />
            </div>
            <button class="btn" type="submit">Chercher</button>
          </form>
          <p class="nearby__note">Distances à vol d'oiseau. La position n'est pas enregistrée.</p>
          <p class="nearby__alert" id="nearbyMsg" role="alert" hidden></p>
          <div id="nearbyMap" hidden></div>
          <div class="nearby__list" id="nearbyList"></div>
        </div>

        <div class="filters" id="filters" role="group" aria-label="Trier les relevés">
          <button class="btn" type="button" data-sort="-ts" aria-pressed="true">Récents</button>
          <button class="btn" type="button" data-sort="-temp" aria-pressed="false">Plus chauds</button>
          <button class="btn" type="button" data-sort="temp" aria-pressed="false">Plus froids</button>
          <button class="btn" type="button" data-sort="-wind" aria-pressed="false">Vent fort</button>
          <button class="btn" type="button" data-sort="-pressure" aria-pressed="false">Haute pression</button>
          <button class="btn" type="button" data-sort="pressure" aria-pressed="false">Basse pression</button>
        </div>

        <div class="outbox" id="outbox" hidden></div>
        <div class="grid" id="grid" aria-busy="true"></div>
        <nav class="pager" id="pager" aria-label="Pagination"></nav>
      </section>
    </main>

    <footer class="footer">
      <div class="wrap footer__inner">
        <p class="footer__name">Ciel</p>
        <p>Relevés de la collection sample_weatherdata.</p>
        <p class="footer__links">
          <a href="/lieux.html">Mes lieux</a>
          <a href="/api-docs">Documentation API</a>
          <span>Recherche avec /</span>
          <span>Nouveau relevé avec N</span>
        </p>
      </div>
    </footer>

    <div class="modal" id="modal" hidden>
      <div class="modal__backdrop" data-close></div>
      <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
        <button class="btn btn--icon modal__close" type="button" data-close aria-label="Fermer">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
        <div id="modalContent"></div>
      </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script src="/tracing.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/tenant.js" defer></script>
    <script src="/geo.js" defer></script>
    <script src="/nearby.js" defer></script>
    <script src="/releve.js" defer></script>
    <script src="/places.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
